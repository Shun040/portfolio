<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zicen Yin — Artist</title>
<meta name="description" content="Artist. Interaction design, cross-media installation and public health.">
<meta name="theme-color" content="#060812">
<link rel="stylesheet" href="css/archive.css?v=1785818661">
<link rel="stylesheet" href="css/sandbox.css?v=1785818661">
<link rel="prefetch" href="work.html">
</head>
<body class="is-home">

<a class="skip" href="#list">Skip to list</a>

<header class="bar">
  <div class="bar-in">
    <span class="name"><b data-i18n="name.full">Zicen Yin</b></span>
    <nav id="nav">
      <a href="work.html#subject" data-i18n="arc.s1">Subject</a>
      <a href="work.html#works"   data-i18n="arc.s2">Works</a>
      <a href="work.html#record"  data-i18n="arc.s3">Record</a>
      <a href="work.html#contact" data-i18n="arc.s4">Contact</a>
    </nav>
    <span class="tools">
      <button class="langbtn" id="lang"
              data-i18n="lang.toggle"
              data-i18n-attr="aria-label:lang.label">中文</button>
    </span>
  </div>
</header>

<main class="home">

  <!-- 标题压在沙盒上方 -->
  <div class="sb-head sheet">
    <p class="cover-role" data-i18n="role">Artist</p>
    <h1 class="cover-name" data-i18n="name.full">Zicen Yin</h1>
    <p class="sb-state" data-i18n="hero.body"></p>
  </div>

  <!-- 沙盒 -->
  <div class="sb-wrap">
    <div class="sb" id="sandbox"></div>
    <div class="sb-label" id="sb-label" aria-hidden="true"></div>
    <p class="sb-hint mono" data-i18n="sb.hint">Hover an object · click to open</p>
    <p class="sb-err mono" id="sb-err" hidden></p>
  </div>

  <!-- WebGL 不可用 / 屏幕阅读器 / 移动端的等价入口 -->
  <nav class="sb-list sheet" id="list">
    <p class="mono" style="margin-bottom:var(--sm)" data-i18n="arc.s2">Works</p>
    <ul id="sb-links"></ul>
  </nav>

</main>

<script>
window.addEventListener('error', function (e) {
  if (!e.target || e.target.tagName !== 'SCRIPT') return;
  var el = document.getElementById('sb-err');
  if (el) { el.textContent = 'script failed: ' + (e.target.src || ''); el.hidden = false; }
}, true);
</script>
<script src="js/spring.js?v=1785818661"></script>
<script src="js/i18n.js?v=1785818661"></script>
<script src="js/data.js?v=1785818661"></script>
<script>
(function () {
  'use strict';
  window.Lang.init();
  document.getElementById('lang').addEventListener('click', function () { window.Lang.toggle(); });

  // 文字入口：沙盒之外的等价路径，永远存在
  function links() {
    var host = document.getElementById('sb-links');
    var L = window.Lang.get(), h = '';
    window.PROJECTS.forEach(function (p) {
      var d = p[L];
      h += '<li><a href="work.html#' + p.key + '">' +
             '<span class="no">' + p.id + '</span>' +
             '<span class="nm">' + d.name + '</span>' +
             '<span class="ty mono">' + d.type + '</span>' +
           '</a></li>';
    });
    host.innerHTML = h;
  }
  links();
  window.Lang.onChange(links);
})();
</script>
<script type="module" src="js/sandbox.js?v=1785818661"></script>
</body>
</html>
