<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zicen Yin — Interaction Design & New Media</title>
<meta name="description" content="Interaction designer and creative technologist in Sydney.">
<meta name="theme-color" content="#08090B">
<link rel="preload" href="js/field.js?v=1785779458" as="script">
<link rel="prefetch" href="work.html">
<link rel="stylesheet" href="css/site.css?v=1785779458">
<link rel="stylesheet" href="css/bento.css?v=1785779458">
<link rel="stylesheet" href="css/splash.css?v=1785779458">
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="splash" id="splash">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="splash-veil" aria-hidden="true"></div>

  <div class="splash-ui">

    <!-- 顶部：署名 / 语言 -->
    <div class="sp-top">
      <div class="sp-mark">
        <b data-i18n="name.full">Zicen Yin</b>
        <span class="mono" data-i18n="role">Interaction Designer · New Media Artist</span>
      </div>
      <button class="langbtn glass" id="lang"
              data-i18n="lang.toggle"
              data-i18n-attr="aria-label:lang.label">中文</button>
    </div>

    <!-- 中部留空：名字由 canvas 显影，不加任何说明文字 -->
    <div class="sp-mid"></div>

    <!-- 底部：进入 / 元信息 -->
    <div class="sp-bot">
      <a class="enter" href="work.html" id="enter">
        <span class="ering" aria-hidden="true"><span class="ar">→</span></span>
        <span class="lab">
          <b data-i18n="splash.enter">Enter</b>
          <span class="mono" data-i18n="splash.enterHint">or press any key</span>
        </span>
      </a>
      <div class="right">
        <span class="mono" data-i18n="splash.kicker">Portfolio 2024 — 2026</span><br>
        <span class="mono" data-i18n="location">Sydney, Australia</span>
      </div>
    </div>

  </div>
</div>

<script src="js/i18n.js?v=1785779458"></script>
<script src="js/field.js?v=1785779458"></script>
<script>
(function () {
  'use strict';

  Lang.init();

  var canvas = document.getElementById('field');
  var splash = document.getElementById('splash');
  var enter  = document.getElementById('enter');

  var field = new Field(canvas, {
    mode: 'splash',
    text: Lang.t('splash.mask'),
    cell: 13,
    gain: 1,
    speed: 1,
    fluid: true,        // 指针搅动名字周围的场
    distortText: false, // 名字本身不被揉散，始终保持可读
    baseReveal: 0.62,   // 名字的基础清晰度（不靠光标也读得出）
    threshold: 0.30
  });

  // 换语言时重画遮罩（"尹紫涔" 和 "ZICEN YIN" 的字宽差很多）
  Lang.onChange(function () { field.setText(Lang.t('splash.mask')); });

  document.getElementById('lang').addEventListener('click', function () { Lang.toggle(); });

  // 进场转场：点阵坍缩 + 压黑，然后跳转
  var leaving = false;
  function go(e) {
    if (leaving) return;
    if (e) e.preventDefault();
    leaving = true;
    splash.classList.add('leaving');
    field.collapseOut(650).then(function () { location.href = 'work.html'; });
    // 动效被系统关闭或 rAF 被挂起时的兜底
    setTimeout(function () { location.href = 'work.html'; }, 1100);
  }

  enter.addEventListener('click', go);

  // 任意键进入，但放过语言切换和 Tab 导航
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Tab' || e.key === 'Shift') return;
    if (document.activeElement === document.getElementById('lang')) return;
    go(e);
  });
})();
</script>
</body>
</html>
